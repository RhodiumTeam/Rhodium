<linearGradient id="leafR" href="#st" gradientUnits="userSpaceOnUse" x1="294" y1="380" x2="312" y2="431"/>
<linearGradient id="leafL" href="#st" gradientUnits="userSpaceOnUse" x1="193" y1="432" x2="186" y2="478"/>
