<use href="#stem" stroke="url(#as)" stroke-width="10.6"/>
<use href="#stem" stroke="#0c1a0d" stroke-width="6.4"/>
<use href="#stem" stroke="#386a42" stroke-width="2" transform="translate(-1.4 0)"/>
<use href="#stem" stroke="#a5cfa8" stroke-width=".8" transform="translate(-1.9 0)"/>
