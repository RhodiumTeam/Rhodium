</radialGradient>
<radialGradient id="eFr" cx=".36" cy=".42" r=".78">
<stop offset="0" stop-color="#e34e4d"/>
<stop offset=".18" stop-color="#cc0722"/>
<stop offset=".42" stop-color="#980916"/>
<stop offset=".7" stop-color="#5c0205"/>
