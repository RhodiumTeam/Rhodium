<stop offset=".7" stop-color="#cc0722"/>
<stop offset="1" stop-color="#980916"/>
</linearGradient>
<linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fef2ea" stop-opacity="0"/>
<stop offset=".35" stop-color="#fef2ea" stop-opacity=".9"/>
<stop offset=".7" stop-color="#fef2ea" stop-opacity=".55"/>
<stop offset="1" stop-color="#fef2ea" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hs" x1="0" y1="0" x2="1" y2="0">
