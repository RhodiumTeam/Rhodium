<use href="#bud" fill="url(#eBud)"/>
<g clip-path="url(#cbud)" fill="none">
<use href="#sp" stroke="#1d0000" stroke-width="8" opacity=".75" filter="url(#soft)" transform="translate(0 -3.5)"/>
<use href="#sp" stroke="#fd9f93" stroke-width="2.6" opacity=".85" transform="translate(0 3.4)"/>
</g>
