<stop offset="1" stop-color="#eef1f4"/>
</linearGradient>
<!-- enamel reds sampled from the banner's rose: ruby-black, candy-apple, warm coral and peach highlights -->
<radialGradient id="eIn" gradientUnits="userSpaceOnUse" cx="258" cy="170" r="175">
<stop offset=".3" stop-color="#2e0001"/>
<stop offset=".62" stop-color="#74070d"/>
<stop offset=".86" stop-color="#cc0722"/>
<stop offset="1" stop-color="#e34e4d"/>
</radialGradient>
<radialGradient id="eBud" gradientUnits="userSpaceOnUse" cx="264" cy="102" r="74" gradientTransform="translate(264 102) scale(1 .8) translate(-264 -102)">
<stop offset="0" stop-color="#3a0102"/>
<stop offset=".45" stop-color="#74070d"/>
<stop offset=".8" stop-color="#cc0722"/>
