<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<style>
.b0{fill:none;stroke:#3a4049;stroke-width:15;stroke-linejoin:round}
.b1{fill:none;stroke:url(#ag);stroke-width:12;stroke-linejoin:round}
.b2{fill:none;stroke:#fbfcfd;stroke-width:5;stroke-linejoin:round}
.r0{fill:none;stroke:#2e0001;stroke-width:5.5;stroke-linejoin:round;stroke-linecap:round}
.r1{fill:none;stroke:url(#ag);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
.r2{fill:none;stroke:#fff;stroke-width:1;stroke-linejoin:round;stroke-linecap:round;transform:translate(-.6px,-.7px)}
.ao{fill:#1d0000;opacity:.7;filter:url(#blur)}
.f{fill:url(#eFr)}.t{fill:url(#eIn)}.l{fill:url(#eLip)}.h{fill:url(#hl)}
.k0{fill:none;stroke:#3a4049;stroke-width:4.6;stroke-linejoin:round;stroke-linecap:round}
.k1{fill:none;stroke:url(#as);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
</style>
<filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"/></filter>
<linearGradient id="ag" gradientUnits="userSpaceOnUse" x1="100" y1="40" x2="400" y2="340">
<stop offset="0" stop-color="#f7f9fb"/>
<stop offset=".12" stop-color="#c3c9d1"/>
<stop offset=".22" stop-color="#fff"/>
<stop offset=".38" stop-color="#a7aeb8"/>
<stop offset=".5" stop-color="#eef1f5"/>
<stop offset=".64" stop-color="#8b939f"/>
<stop offset=".78" stop-color="#e3e7ec"/>
<stop offset=".9" stop-color="#9da4af"/>
<stop offset="1" stop-color="#d9dde3"/>
</linearGradient>
<!-- silver rim on the steel parts: kept bright so they read on a dark page -->
<linearGradient id="as" gradientUnits="userSpaceOnUse" x1="130" y1="330" x2="380" y2="510">
<stop offset="0" stop-color="#fff"/>
