<stop offset=".2" stop-color="#fef2ea" stop-opacity=".95"/>
<stop offset=".6" stop-color="#fef2ea" stop-opacity=".8"/>
<stop offset="1" stop-color="#fef2ea" stop-opacity="0"/>
</linearGradient>
<!-- green-black steel sampled from the banner's leaves: lit half with a green sheen, a dark fold, shadow half -->
<linearGradient id="st" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#99c69c"/>
<stop offset=".08" stop-color="#619669"/>
<stop offset=".22" stop-color="#284b2f"/>
<stop offset=".45" stop-color="#102213"/>
<stop offset=".48" stop-color="#051408"/>
